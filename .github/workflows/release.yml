# Publishes a release when a version tag is pushed:
#
#     git tag v2.0.0 && git push origin v2.0.0
#
# It stamps module.json with the tag's version and a download URL pinned to that
# exact release, zips the module, and attaches both to a GitHub release. The
# pinned download matters: the manifest URL in module.json stays on
# `releases/latest`, so Foundry always finds the newest version, but each
# published manifest points at its own zip — which is what lets someone install
# an older release deliberately.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The gate. A tag that cannot pass the tests should not become a release.
      - name: Run tests
        run: node test/run.mjs

      - name: Derive version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const {VERSION, REPO} = process.env;
            m.version = VERSION;
            m.url = `https://github.com/${REPO}`;
            m.manifest = `https://github.com/${REPO}/releases/latest/download/module.json`;
            m.download = `https://github.com/${REPO}/releases/download/v${VERSION}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
            console.log(`stamped ${m.id} ${m.version}`);
          '

      - name: Fail if the manifest disagrees with the tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e '
            const m = require("./module.json");
            if (m.version !== process.env.VERSION) {
              console.error(`module.json says ${m.version}, tag says ${process.env.VERSION}`);
              process.exit(1);
            }
          '

      - name: Build the package
        run: |
          zip -r module.zip \
            module.json \
            README.md \
            CHANGELOG.md \
            LICENSE \
            scripts/ \
            styles/ \
            lang/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.value }}
          body: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          files: |
            module.json
            module.zip
